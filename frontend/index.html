<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#153E7C" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chaukas AI" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="description" content="Chaukas AI - From Complaint to Closure. AI-powered civic issue reporting, prioritisation and resolution tracking." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      // theme pehle hi set (flash se bachne ke liye)
      (function () {
        try {
          var m = localStorage.getItem("chaukas-theme") || "light";
          var t = m === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : m;
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
          var c = document.querySelector('meta[name="theme-color"]'); if (c) c.setAttribute("content", t === "light" ? "#153E7C" : "#0F141F");
        } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
      })();
    </script>
    <title>Chaukas AI - From Complaint to Closure</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
